[project]
name = "braindump-scraper"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pypdf>=6.18.1,<7",
    "scrapling[fetchers]>=0.4,<0.5",
    "trafilatura>=2,<3",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff==0.16.6",
]
