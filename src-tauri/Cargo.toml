[package]
name = "braindump-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.4"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
