<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Braindump</title>
    <link rel="stylesheet" href="style.css" />
    <script src="status.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Braindump</h1>
      <p id="status" role="status">Starting your local library…</p>
      <p>
        Closing the window keeps processing running. Choose Quit Braindump to
        stop.
      </p>
      <p>
        You can restore an existing library backup in Settings &amp; Backups
        once the app opens.
      </p>
    </main>
  </body>
</html>
